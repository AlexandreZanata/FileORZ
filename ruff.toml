# Ruff — align with Agent Harness caps
# https://docs.astral.sh/ruff/

line-length = 100

exclude = [
  ".git",
  ".local",
  ".venv",
  "venv",
  "agent-rules",
  "agent-harness",
  "dist",
  "build",
  "__pycache__",
  "node_modules",
]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[lint.per-file-ignores]
# Path bootstrap before local imports (sys.path insert).
"scripts/check_size_complexity.py" = ["E402"]
"FileORZ.py" = ["E402"]
"AutoBuild/AutoBuild.py" = ["E402"]
"ui/btn.py" = ["E402"]
"ui/index.py" = ["E402"]
"utils/StartTask.py" = ["E402"]
"utils/AutoDelete.py" = ["E402"]

[lint.mccabe]
max-complexity = 10

[format]
quote-style = "double"
