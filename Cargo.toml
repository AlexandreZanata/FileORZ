[workspace]
resolver = "2"
members = [
    "crates/fileorz",
    "crates/fileorz-core",
    "crates/fileorz-i18n",
    "crates/fileorz-linux",
    "crates/fileorz-ui",
    "crates/fileorz-parity",
    "crates/fileorz-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/AlexandreZanata/FileORZ"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

# Release binaries for packaging (phase 17): strip symbols by default.
# Reinforced in docs/INSTALL-LINUX.md; override with RUSTFLAGS if needed.
[profile.release]
strip = "symbols"
